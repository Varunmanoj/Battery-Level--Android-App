plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.appdistribution'
}

def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('key.properties')
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { input ->
        releaseSigningProperties.load(input)
    }
}
def releaseSigningConfigured = [
    'storeFile',
    'storePassword',
    'keyAlias',
    'keyPassword',
].every { propertyName -> releaseSigningProperties.getProperty(propertyName) }

android {
    namespace 'com.varunmanojkumar.batterylevel'
    compileSdk 37

    defaultConfig {
        applicationId "com.varunmanojkumar.batterylevel"
        minSdk 23
        targetSdk 37

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    flavorDimensions += "device"
    productFlavors {
        mobile {
            dimension "device"
            versionCode 140
            versionName "8"
        }
        wear {
            dimension "device"
            minSdk 25
            versionCode 143
            versionName "8"
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile rootProject.file(releaseSigningProperties.getProperty('storeFile'))
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                debugSymbolLevel 'FULL'
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        compose true
    }
}

dependencies {

    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')
    def firebaseBom = platform('com.google.firebase:firebase-bom:34.16.0')

    implementation composeBom
    androidTestImplementation composeBom
    implementation firebaseBom

    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.core:core-splashscreen:1.2.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    wearImplementation 'androidx.wear.compose:compose-foundation:1.6.2'
    wearImplementation 'androidx.wear.compose:compose-material3:1.6.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-perf'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}

def requireReleaseSigning = tasks.register('requireReleaseSigning') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException(
                'Release signing is not configured. Fill in the ignored key.properties file ' +
                    'before building Play Store bundles.',
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'bundleMobileRelease' || task.name == 'bundleWearRelease') {
        task.dependsOn(requireReleaseSigning)
    }
}

tasks.register('bundlePlayRelease') {
    group = 'build'
    description = 'Builds the signed mobile and Wear OS bundles for Google Play.'
    dependsOn('bundleMobileRelease', 'bundleWearRelease')
    doLast {
        logger.lifecycle(
            'Google Play bundles: app/build/outputs/bundle/mobileRelease/' +
                'app-mobile-release.aab and app/build/outputs/bundle/wearRelease/' +
                'app-wear-release.aab',
        )
    }
}
